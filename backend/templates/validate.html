<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validate IP | IPAM System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">IPAM System</a>

        <div class="navbar-nav">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link" href="/networks">Networks</a>
            <a class="nav-link" href="/ip-addresses">
                IP Addresses
            </a>
            <a class="nav-link active" href="/validate">
                Validate IP
            </a>
        </div>

    </div>
</nav>

<main class="container py-5">

    <div class="mb-4">
        <h1>Validate IP Address</h1>

        <p class="text-muted">
            Provjerite format, pripadnost mreži i dostupnost IP adrese.
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form id="validation-form">

                <div class="mb-3">
                    <label for="validation-address" class="form-label">
                        IP Address
                    </label>

                    <input
                        type="text"
                        id="validation-address"
                        class="form-control"
                        placeholder="192.168.1.20"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="validation-network" class="form-label">
                        Network
                    </label>

                    <select
                        id="validation-network"
                        class="form-select"
                        required
                    >
                        <option value="">Odaberite mrežu</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Validate
                </button>

            </form>

            <div id="validation-result" class="mt-4"></div>

        </div>
    </div>

</main>

<script
    src="{{ url_for('static', filename='validate.js') }}">
</script>

</body>
</html>
