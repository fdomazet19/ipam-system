<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Networks | IPAM System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            IPAM System
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="/">
                Dashboard
            </a>

            <a class="nav-link active" href="/networks">
                Networks
            </a>
            <a class="nav-link" href="/ip-addresses">
    IP Addresses
</a>
<a class="nav-link" href="/validate">
    Validate IP
</a>
        </div>

    </div>
</nav>

<main class="container py-5">

    <div class="mb-4">
        <h1>Networks</h1>

        <p class="text-muted">
            Pregled mreža spremljenih u IPAM sustavu.
        </p>
    </div>

    <div id="message"></div>
    <div class="card shadow-sm mb-4">

    <div class="card-body">

        <h4 class="mb-3">Add Network</h4>

        <form id="network-form">

            <div class="mb-3">
                <label class="form-label">
                    Network Name
                </label>

                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Office LAN"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    CIDR
                </label>

                <input
                    type="text"
                    id="cidr"
                    class="form-control"
                    placeholder="192.168.1.0/24"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Description
                </label>

                <textarea
                    id="description"
                    class="form-control"
                    rows="3"
                    placeholder="Main office network">
                </textarea>
            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Add Network

            </button>

        </form>

    </div>

</div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead>
    <tr>
        <th>ID</th>
        <th>Naziv</th>
        <th>CIDR</th>
        <th>Opis</th>
        <th>Akcije</th>
    </tr>
</thead>

                    <tbody id="network-table-body">
                        <tr>
                            <td colspan="5">
                                Učitavanje podataka...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
