<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Addresses | IPAM System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            IPAM System
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="/">Dashboard</a>
            <a class="nav-link" href="/networks">Networks</a>
            <a class="nav-link active" href="/ip-addresses">
                IP Addresses
            </a>
            <a class="nav-link" href="/validate">
    Validate IP
</a>
        </div>

    </div>
</nav>

<main class="container py-5">

    <div class="mb-4">
        <h1>IP Addresses</h1>

        <p class="text-muted">
            Upravljanje IP adresama unutar spremljenih mreža.
        </p>
    </div>

    <div id="ip-message"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h2 class="h4 mb-3">Add IP Address</h2>

            <form id="ip-address-form">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="ip-address" class="form-label">
                            IP Address
                        </label>

                        <input
                            type="text"
                            id="ip-address"
                            class="form-control"
                            placeholder="192.168.1.10"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="hostname" class="form-label">
                            Hostname
                        </label>

                        <input
                            type="text"
                            id="hostname"
                            class="form-control"
                            placeholder="PC-01"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="status" class="form-label">
                            Status
                        </label>

                        <select id="status" class="form-select">
                            <option value="free">Free</option>
                            <option value="reserved">Reserved</option>
                            <option value="used">Used</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="network-id" class="form-label">
                            Network
                        </label>

                        <select
                            id="network-id"
                            class="form-select"
                            required
                        >
                            <option value="">
                                Odaberite mrežu
                            </option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary">
                    Add IP Address
                </button>

            </form>

        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>IP adresa</th>
                            <th>Hostname</th>
                            <th>Status</th>
                            <th>Mreža</th>
                            <th>Akcije</th>
                        </tr>
                    </thead>

                    <tbody id="ip-address-table-body">
                        <tr>
                            <td colspan="6">
                                Učitavanje podataka...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>
    </div>

</main>

<script
    src="{{ url_for('static', filename='ip_addresses.js') }}">
</script>

</body>
</html>
